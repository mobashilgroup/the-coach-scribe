# Production-shaped stack for The Coach Scribe.
#   cp .env.example .env   # then fill real values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# `migrate` runs once to apply migrations, then `api` and `worker` start.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcs}
      POSTGRES_DB: ${POSTGRES_DB:-tcs}
    volumes:
      - tcs_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcs}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    working_dir: /app/services/api
    command: pnpm exec prisma migrate deploy
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    env_file: .env
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    working_dir: /app/services/api
    command: pnpm exec tsx src/worker.ts
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  tcs_pg:
